[project]
name = "ctr-prediction-pipeline"
version = "0.1.0"
description = "End-to-end click-through-rate prediction on public ad data: training, serving, scheduled retraining and monitoring."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "lightgbm>=4.7",  # eval_X/eval_y API
    "torch>=2.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
data = ["kaggle>=1.6", "six>=1.16"]  # kaggle imports six without declaring it
tracking = ["mlflow>=2.14"]  # experiment tracking; not needed to serve a model

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

# CPU-only PyTorch wheels: the default Linux wheel pulls in ~1 GB of CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=ctr --cov-report=term-missing"
