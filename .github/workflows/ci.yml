name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install
        run: uv sync --locked --all-extras

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Train a small model on synthetic data
        run: |
          uv sync --locked
          uv run python -c "from ctr.sample import make_synthetic; make_synthetic(n_rows=20000).to_csv('synthetic.csv', index=False)"
          uv run python -m ctr.export --data synthetic.csv --sample-frac 1 --models lightgbm \
            --model-kwargs '{"lightgbm": {"n_estimators": 100}}'

      - name: Build image
        run: docker build -t ctr-api --build-arg MODEL_DIR=artifacts/lightgbm .

      - name: Smoke test the container
        run: |
          docker run -d --name ctr-api -p 8080:8080 ctr-api
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/health | jq -e '.status == "ok" and .model == "lightgbm"'
          curl -sf -X POST localhost:8080/predict -H 'Content-Type: application/json' \
            -d @examples/request.json | tee response.json
          jq -e '(.probabilities | length) == 2 and all(.probabilities[]; . > 0 and . < 1)' response.json
          docker inspect --format '{{.Config.User}}' ctr-api | grep -qx app

      - name: Image size
        if: always()
        run: docker image ls ctr-api --format '{{.Size}}'

      - name: Container logs
        if: failure()
        run: docker logs ctr-api

  airflow:
    needs: test
    runs-on: ubuntu-latest
    env:
      AIRFLOW_VERSION: "3.4.0"
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/airflow/dags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Airflow and the package
        run: |
          CONSTRAINTS="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-3.11.txt"
          pip install "apache-airflow==${AIRFLOW_VERSION}" lightgbm pandas pyarrow scikit-learn \
            scipy matplotlib joblib pytest --constraint "$CONSTRAINTS"
          pip install --no-deps .

      - name: Set up the Airflow database
        run: airflow db migrate

      - name: Run the DAG for two days
        run: pytest tests/test_dag.py -o addopts="" -v
